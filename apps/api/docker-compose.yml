services:
  postgres:
    image: postgres:17
    container_name: paypal-autopilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: F54t2B9A
      POSTGRES_DB: paypal_autopilot

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: